<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Wealth, shown to scale</title>
  <meta name="description" content="Global wealth inequality visualized at true scale." />

  <meta property="og:title" content="Wealth, shown to scale" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://evolving-thoughts.github.io/1-pixel-wealth/" />
  <meta property="og:description" content="Global wealth inequality visualized at true scale." />
  <meta property="og:image" content="https://evolving-thoughts.github.io/1-pixel-wealth/img/og_english.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="Wealth shown to scale: $1,000, $64,116 median US income, and $1 million compared visually" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://evolving-thoughts.github.io/1-pixel-wealth/img/og_english.png" />
  <link rel="canonical" href="https://evolving-thoughts.github.io/1-pixel-wealth/" />

  <link rel="stylesheet" type="text/css" href="main.css?version=3.0">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
</head>
<body>
<noscript><p style="text-align:center;padding:2em;font-family:sans-serif">Please enable JavaScript to view this page.</p></noscript>

  <div class="wealth-wrapper-outer"><!--i18n-start-->
    <div class="wealth-row">
      <div class="title-screen">
        <h1 class="i18n-wealth-shown-to">Wealth shown to scale</h1>

        <!-- One real pixel, an arrow pointing at it, and the same pixel magnified -->
        <div class="pixel-legend">
          <p class="pixel-eq i18n-pixel-eq">1 pixel = $1,000</p>
          <div class="pixel-row">
            <span class="one-pixel"></span>
            <svg class="pixel-arrow" width="66" height="12" viewBox="0 0 66 12" aria-hidden="true"><path d="M64 6H2M8 1.5L2 6l6 4.5" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="pixel-lens" viewBox="0 0 132 132" width="132" height="132" aria-hidden="true"><defs><clipPath id="lens-clip"><circle cx="60" cy="60" r="50"/></clipPath></defs><g clip-path="url(#lens-clip)"><rect width="120" height="120" fill="#fff"/><path d="M10 0V120M30 0V120M50 0V120M70 0V120M90 0V120M110 0V120M0 10H120M0 30H120M0 50H120M0 70H120M0 90H120M0 110H120" stroke="#D3D5D9"/><rect x="50" y="50" width="20" height="20" fill="#111"/></g><circle cx="60" cy="60" r="50" fill="none" stroke="#111" stroke-width="3"/><path d="M97 97l26 26" stroke="#111" stroke-width="7" stroke-linecap="round"/></svg>
          </div>
          <span class="pixel-note i18n-pixel-note">The dot at the tip of the arrow is real: a single pixel.</span>
        </div>

        <div class="scroll-this-way">
          <svg width="24" height="96" viewBox="0 0 24 96" aria-hidden="true"><path d="M12 0v93M2 83l10 10 10-10" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span class="i18n-scroll">scroll</span>
        </div>
        <p class="inspired-by i18n-inspired-by">inspired by <a href="https://github.com/mkorostoff" target="_blank" rel="noopener noreferrer">mkorostoff</a></p>
      </div>

      <!-- Calibration: amount large, description small, equal gaps -->
      <div class="wealth-wrapper calibration median">
        <h2 class="wealth-title i18n-median-amount">$64,116</h2>
        <p class="wealth-desc i18n-median-desc">Median US income</p>
        <div class="wealth"></div>
      </div>

      <div class="wealth-wrapper calibration million">
        <h2 class="wealth-title i18n-USD1-million">$1 million</h2>
        <div class="wealth"></div>
      </div>

      <div class="wealth-wrapper billion">
        <div class="wealth">
          <h2 class="wealth-title i18n-USD1-billion">$1 billion</h2>
        </div>
      </div>

      <!-- Richest person bar — content injected by main.js from story.json -->
      <div name="richest" class="wealth-wrapper richest">
        <div id="richest" class="wealth">
          <div class="bar-backdrop" aria-hidden="true"></div>
          <div class="bar-hud">
            <div class="wealth-header">
              <h2 class="wealth-title"><span class="total" id="richest-total">…</span><span class="who" id="richest-who"></span></h2>
              <div class="counter" id="richest-counter"></div>
            </div>
            <div class="key"><span class="scale-label">—</span></div>
            <div class="ruler-view" aria-hidden="true"><div class="ruler-track"></div></div>
          </div>
          <div id="richest-comparisons"></div>
        </div>
      </div>

      <!-- All-billionaires bar — segmented, content injected -->
      <div id="allBillionaires-wrapper" class="wealth-wrapper all-billionaires">
        <div id="allBillionaires" class="wealth">
          <div class="bar-backdrop" aria-hidden="true"></div>
          <div class="bar-hud">
            <div class="wealth-header">
              <h2 class="wealth-title"><span class="total" id="allBillionaires-total">…</span><span class="who" id="allBillionaires-who"></span></h2>
              <div class="counter" id="allBillionaires-counter"></div>
            </div>
            <div class="key"><span class="scale-label">—</span></div>
            <div class="ruler-view" aria-hidden="true"><div class="ruler-track"></div></div>
          </div>
          <div id="allBillionaires-comparisons"></div>
        </div>
      </div>

      <button id="next-message-btn" class="next-message-btn" hidden>Next message</button>

    </div>
  </div>
<!--i18n-end-->

<!-- Death ticker overlay -->
<div id="death-ticker" class="death-ticker" hidden>
  <button id="death-ticker-close" class="death-ticker-close" title="Minimize" aria-label="Minimize"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <span class="death-ticker-label">Preventable deaths since you opened this page</span>
  <div id="death-ticker-counts"></div>
</div>
<button id="death-ticker-reopen" class="death-ticker-reopen" title="Show death ticker" style="display:none;"><span class="ticker-dot"></span><span class="ticker-pill-count" id="death-ticker-pill-count">0</span> <span class="ticker-pill-label" id="death-ticker-pill-label">deaths</span></button>

<script type="text/javascript" src="viz.js?version=3.0" defer></script>
<script type="text/javascript" src="main.js?version=3.0" defer></script>
<div id="data-source" style="text-align:center;padding:8px;font-size:12px;color:#666;"></div>
</body>
</html>
